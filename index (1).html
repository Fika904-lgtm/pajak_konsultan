<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Konsultan Pajak Nusantara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#22265a; --paper:#ffffff;
  --bg:#a9e2ff; --dot:#8fd3fa; --on-bg:#22265a;
  --yellow:#ffd23f; --coral:#ff6b6b; --mint:#35d6a4; --sky:#4cc9f0; --grape:#8b6cf0; --soft:#fff2b8;
  --font:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1a1d4d;--dot:#282d6e;--on-bg:#ffffff}
}
:root[data-theme="dark"]{--bg:#1a1d4d;--dot:#282d6e;--on-bg:#ffffff}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;font-family:var(--font);font-size:16px;line-height:1.45;color:var(--on-bg);
  background-color:var(--bg);background-image:radial-gradient(var(--dot) 2.5px,transparent 3px);background-size:22px 22px;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:14px 14px 44px}
h1,h2,h3{margin:0;font-weight:700;line-height:1.15}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:4px solid var(--grape);outline-offset:2px}

/* kartu & tombol */
.card{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:14px;margin:0 0 16px}
.btn{display:block;width:100%;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);
  padding:12px 16px;font-weight:700;font-size:18px;cursor:pointer;text-align:center;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.mint{background:var(--mint)} .btn.coral{background:var(--coral);color:#fff} .btn.white{background:#fff} .btn.sky{background:var(--sky)}
.btn.small{display:inline-block;width:auto;padding:6px 12px;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 2px 0 var(--ink);transform:translateY(2px)}
.icon{width:44px;height:44px;flex:none;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);font-size:20px;cursor:pointer}
.icon:active{transform:translateY(3px);box-shadow:none}
.stack>*+*{margin-top:12px}
.center{text-align:center}
.muted{opacity:.75;font-size:14px}

/* start */
.hero{text-align:center;padding-top:6px}
.title{font-size:44px;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);letter-spacing:.5px;transform:rotate(-2deg);margin:4px 0 2px}
.title.two{color:var(--coral);transform:rotate(1.5deg);font-size:38px}
.scene{width:100%;max-width:340px;height:auto;display:block;margin:6px auto 0}
.mascot-row{display:flex;align-items:flex-end;gap:8px;margin:0 0 14px}
.rupi{width:92px;flex:none;animation:hop 1.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.say{position:relative;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:500;flex:1;margin-bottom:26px}
.field-l{display:block;font-weight:600;margin:0 0 6px}
.txt{width:100%;border:3px solid var(--ink);border-radius:14px;padding:11px 14px;background:#fff;color:var(--ink);font-weight:500}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.avb{border:3px solid var(--ink);border-radius:18px;background:var(--sky);padding:2px;cursor:pointer;aspect-ratio:1}
.avb svg{width:100%;height:100%;display:block}
.avb[aria-pressed="true"]{background:var(--yellow);box-shadow:0 4px 0 var(--ink);transform:translateY(-3px) rotate(-3deg)}

/* hub */
.head{display:flex;gap:12px;align-items:center}
.me{width:64px;height:64px;border:3px solid var(--ink);border-radius:50%;background:var(--yellow);overflow:hidden;flex:none}
.me svg,.mini svg,.big svg,.cav svg{width:100%;height:100%;display:block}
.head b{font-size:20px}
.pill{display:inline-block;background:var(--soft);border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:14px;font-weight:600;margin:4px 6px 0 0}
.bar{height:14px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--mint);transition:width .4s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.cl{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:10px 10px 12px;text-align:center;cursor:pointer;position:relative;font-weight:600}
.cl:nth-child(odd){transform:rotate(-1.5deg)} .cl:nth-child(even){transform:rotate(1.5deg)}
.cl:active{transform:translateY(3px)}
.cav{width:84px;height:84px;margin:0 auto 6px;border:3px solid var(--ink);border-radius:50%;overflow:hidden}
.cl b{display:block;font-size:17px;line-height:1.15}
.cl small{display:block;font-weight:500;font-size:13px;margin:2px 0 6px}
.badge{display:inline-block;border:2px dashed var(--ink);border-radius:10px;padding:1px 8px;font-size:13px;opacity:.7}
.badge.ok{border-style:solid;background:var(--mint);opacity:1;transform:rotate(-4deg);font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pulse{animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.03)}}

/* misi */
.mbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.mtitle{flex:1;min-width:0;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:4px 10px;line-height:1.15}
.mtitle span{display:block;font-size:13px;font-weight:500}
.steps{display:flex;gap:6px;margin:0 0 14px}
.steps span{flex:1;text-align:center;font-size:13px;font-weight:600;padding:6px 2px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink)}
.steps .on{background:var(--yellow)} .steps .done{background:var(--mint)}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.msg{display:flex;gap:8px;align-items:flex-end}
.msg.me{justify-content:flex-end}
.mini{width:44px;height:44px;border:3px solid var(--ink);border-radius:50%;background:var(--sky);overflow:hidden;flex:none}
.bubble{max-width:82%;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:6px 18px 18px 18px;padding:9px 13px;font-weight:500}
.msg.me .bubble{background:var(--yellow);border-radius:18px 6px 18px 18px}
.msg.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.note{background:var(--soft);color:var(--ink);border:3px solid var(--ink);border-radius:6px 16px 16px 16px;padding:10px 14px;margin:0 0 14px;transform:rotate(-.6deg)}
.note ul{margin:6px 0 0;padding-left:20px}
.note.empty{opacity:.85}
.quota{display:flex;align-items:center;gap:4px;margin:0 0 10px;font-weight:600}
.coin{font-size:22px} .coin.used{filter:grayscale(1);opacity:.35}
.qs{display:grid;gap:8px;margin-bottom:12px}
.q{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;text-align:left;font-weight:500;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.q:active{transform:translateY(3px);box-shadow:none}
.q:disabled{opacity:.4;box-shadow:none;transform:translateY(3px);cursor:not-allowed}
.opt{display:block;width:100%;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:11px 13px;margin-top:10px;text-align:left;font-weight:500;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt.bad{background:#ffd3d3;text-decoration:line-through;opacity:.8;box-shadow:none}
.opt.good{background:#c6f5e3;box-shadow:0 3px 0 var(--ink)}
.fb{border:3px dashed var(--ink);border-radius:14px;padding:10px 12px;margin-top:12px;background:var(--soft);color:var(--ink)}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* formulir pajak */
.doc{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:8px 22px 8px 22px;box-shadow:0 5px 0 var(--ink);padding:14px;margin-bottom:16px;position:relative;
  background-image:repeating-linear-gradient(transparent 0 31px,rgba(76,201,240,.25) 31px 32px)}
.doc h3{font-size:19px;padding-right:76px}
.ribbon{position:absolute;top:-2px;right:12px;background:var(--coral);color:#fff;border:3px solid var(--ink);border-top:0;border-radius:0 0 12px 12px;padding:6px 10px;font-weight:700;font-size:13px}
.grp{margin:14px 0 4px;font-weight:700;background:var(--sky);border:2px solid var(--ink);border-radius:10px;padding:2px 10px;display:inline-block}
.frow{margin-top:10px}
.frow label{display:block;font-weight:600;font-size:15px;margin-bottom:4px}
.frow.info{display:flex;justify-content:space-between;gap:8px;background:var(--soft);border:2px solid var(--ink);border-radius:10px;padding:6px 10px}
.inwrap{display:flex;align-items:center;border:3px solid var(--ink);border-radius:12px;background:#fff;overflow:hidden}
.inwrap i{font-style:normal;font-weight:700;padding:0 10px;align-self:stretch;display:flex;align-items:center;background:var(--yellow);border-right:3px solid var(--ink)}
.inwrap input{border:0;outline:0;background:transparent;padding:10px;width:100%;min-width:0;font-weight:600;color:var(--ink)}
.frow select{width:100%;border:3px solid var(--ink);border-radius:12px;padding:10px;background:#fff;color:var(--ink);font-weight:600}
.frow.ok .inwrap,.frow.ok select{background:#c6f5e3}
.frow.bad .inwrap,.frow.bad select{background:#ffd3d3}
.frow.reveal .inwrap,.frow.reveal select{background:#e5dcff}
.hint{font-size:14px;margin-top:4px;font-weight:500}

/* hasil */
.big{width:150px;height:150px;margin:0 auto 6px;border:3px solid var(--ink);border-radius:50%;background:var(--sky);overflow:hidden}
.score{display:flex;justify-content:space-between;padding:5px 0;border-bottom:2px dotted var(--ink);font-weight:500}
.score.total{border:0;font-size:22px;font-weight:700;padding-top:10px}
.stamp{display:inline-block;border:4px solid var(--coral);color:var(--coral);border-radius:12px;padding:2px 14px;font-weight:700;font-size:22px;transform:rotate(-7deg);animation:stamp .35s ease-out}
@keyframes stamp{from{transform:rotate(-7deg) scale(2.2);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:1}}
ul.pts{margin:8px 0 0;padding-left:20px}
ul.pts li+li{margin-top:6px}
table.rap{width:100%;border-collapse:collapse}
table.rap td{padding:8px 4px;border-bottom:2px dotted var(--ink);font-weight:500}
table.rap td:last-child{text-align:right;font-weight:700}
.code{word-break:break-all;background:var(--soft);border:2px dashed var(--ink);border-radius:10px;padding:8px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}

/* sheet, kalkulator, buku saku */
.sheet-wrap{position:fixed;inset:0;background:rgba(20,22,60,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;max-width:520px;max-height:88%;overflow:auto;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:22px;margin-bottom:8px}
details{border:3px solid var(--ink);border-radius:14px;margin-top:10px;background:#fff}
summary{cursor:pointer;font-weight:700;padding:10px 12px;list-style:none}
summary::-webkit-details-marker{display:none}
details[open] summary{background:var(--yellow);border-radius:10px 10px 0 0;border-bottom:3px solid var(--ink)}
.dbody{padding:4px 12px 12px;font-size:15px}
.dbody ul{padding-left:18px;margin:6px 0}
.ver{display:inline-block;background:var(--coral);color:#fff;border-radius:8px;padding:0 7px;font-size:12px;font-weight:600;margin-left:4px;vertical-align:1px}
table.ter{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
table.ter th,table.ter td{border:2px solid var(--ink);padding:3px 6px;text-align:right}
table.ter th{background:var(--sky);text-align:center}
.disp{background:var(--ink);color:#fff;border-radius:12px;padding:12px;text-align:right;font-size:26px;min-height:54px;overflow-x:auto;white-space:nowrap;margin-bottom:10px;font-weight:600}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{padding:12px 0;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.keys button:active{transform:translateY(3px);box-shadow:none}
.keys .op{background:var(--sky)} .keys .eq{background:var(--yellow)} .keys .cl2{background:var(--coral);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border:3px solid #fff;border-radius:14px;padding:8px 16px;font-weight:600;z-index:60;max-width:90%;text-align:center}
.foot{font-size:13px;text-align:center;margin-top:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>
<noscript><p style="padding:20px">Aktifkan JavaScript untuk memainkan game ini.</p></noscript>

<script>
"use strict";
const INK = '#22265a';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp' + Number(n).toLocaleString('id-ID');

/* ===== AVATAR KARTUN (SVG) ===== */
function avatar(c, mood) {
  mood = mood || 'happy';
  const skin = c.skin || '#f6c39a', hair = c.hair || '#2b1d1a', shirt = c.shirt || '#4cc9f0';
  const S = `stroke="${INK}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"`;
  const hij = c.style === 'hijab';
  let back = '', front = '';
  if (hij) back = `<ellipse cx="50" cy="54" rx="35" ry="38" fill="${hair}" ${S}/>`;
  if (c.style === 'bob') back = `<path d="M17 58 Q14 14 50 13 Q86 14 83 58 L83 72 Q50 66 17 72Z" fill="${hair}" ${S}/>`;
  if (c.style === 'bun') back = `<circle cx="50" cy="10" r="11" fill="${hair}" ${S}/>`;
  if (c.style === 'bob' || c.style === 'bun')
    front = `<path d="M24 46 Q26 17 50 17 Q74 17 76 46 Q62 30 50 34 Q36 30 24 46Z" fill="${hair}" ${S}/>`;
  if (c.style === 'spiky')
    front = `<path d="M22 44 L19 27 L32 31 L34 12 L44 25 L54 8 L60 25 L72 12 L72 31 L82 27 L78 44 Q50 28 22 44Z" fill="${hair}" ${S}/>`;
  if (c.style === 'cap')
    front = `<path d="M22 40 Q24 11 50 11 Q76 11 78 40Z" fill="${c.cap || '#ff6b6b'}" ${S}/><path d="M60 37 L93 41 L91 48 L58 44Z" fill="${c.cap || '#ff6b6b'}" ${S}/><circle cx="50" cy="11" r="3" fill="#fff" ${S}/>`;
  const cy = hij ? 54 : 48, rx = hij ? 23 : 27, ry = hij ? 26 : 28, dy = hij ? 5 : 0;
  const head = `<ellipse cx="50" cy="${cy}" rx="${rx}" ry="${ry}" fill="${skin}" ${S}/>`;
  const eyeN = `<ellipse cx="39" cy="50" rx="3.6" ry="4.6" fill="${INK}"/><ellipse cx="61" cy="50" rx="3.6" ry="4.6" fill="${INK}"/><circle cx="40.3" cy="48.4" r="1.3" fill="#fff"/><circle cx="62.3" cy="48.4" r="1.3" fill="#fff"/>`;
  const eyeJ = `<path d="M34 53 Q39 45 44 53M56 53 Q61 45 66 53" fill="none" stroke="${INK}" stroke-width="3.2" stroke-linecap="round"/>`;
  let eyes = mood === 'joy' ? eyeJ : eyeN, brows = '', mouth = '', extra = '';
  if (mood === 'worried') brows = `<path d="M33 43 L45 39M55 39 L67 43" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
  if (mood === 'angry') brows = `<path d="M33 38 L45 44M55 44 L67 38" stroke="${INK}" stroke-width="3.4" stroke-linecap="round"/>`;
  if (mood === 'think') brows = `<path d="M33 42 L45 42M55 38 Q61 35 67 39" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
  if (mood === 'happy' || mood === 'joy') mouth = `<path d="M39 60 Q50 76 61 60Z" fill="#8a1c3a" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="M45 66 Q50 71 55 66" fill="#ff8fa3"/>`;
  if (mood === 'neutral') mouth = `<path d="M42 64 Q50 68 58 64" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
  if (mood === 'worried') { mouth = `<path d="M41 67 Q45.5 62 50 66 Q54.5 70 59 65" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`; extra = `<path d="M76 28 Q81 37 76 42 Q71 37 76 28Z" fill="#8fdcff" stroke="${INK}" stroke-width="2.5"/>`; }
  if (mood === 'angry') mouth = `<path d="M41 68 Q50 59 59 68" fill="none" stroke="${INK}" stroke-width="3.2" stroke-linecap="round"/>`;
  if (mood === 'think') mouth = `<ellipse cx="50" cy="65" rx="3.4" ry="4" fill="#8a1c3a" stroke="${INK}" stroke-width="2.5"/>`;
  const blush = `<circle cx="30" cy="59" r="4.5" fill="#ff8fa3" opacity=".65"/><circle cx="70" cy="59" r="4.5" fill="#ff8fa3" opacity=".65"/>`;
  const gl = c.glasses ? `<circle cx="39" cy="50" r="9" fill="rgba(255,255,255,.35)" stroke="${INK}" stroke-width="2.8"/><circle cx="61" cy="50" r="9" fill="rgba(255,255,255,.35)" stroke="${INK}" stroke-width="2.8"/><path d="M48 50 L52 50" stroke="${INK}" stroke-width="2.8"/>` : '';
  const body = `<path d="M12 104 C12 78 28 70 50 70 C72 70 88 78 88 104Z" fill="${shirt}" ${S}/>`;
  return `<svg viewBox="0 0 100 100" role="img" aria-label="Karakter kartun">${body}${back}${head}<g transform="translate(0 ${dy})">${blush}${eyes}${brows}${gl}${mouth}</g>${front}${extra}</svg>`;
}

const RUPI = `<svg viewBox="0 0 120 130" class="rupi" role="img" aria-label="Si Rupi, maskot koin">
<g stroke="${INK}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path d="M46 100 L42 121M74 100 L78 121M36 122 h12M72 122 h12" fill="none"/>
<path d="M18 66 Q4 58 8 40M102 66 Q114 76 110 92" fill="none"/>
<circle cx="8" cy="38" r="6" fill="#ffd23f"/><circle cx="110" cy="94" r="6" fill="#ffd23f"/>
<circle cx="60" cy="60" r="44" fill="#ffd23f"/>
<circle cx="60" cy="60" r="34" fill="none" stroke="#e0a100" stroke-width="3" stroke-dasharray="2 7"/>
</g>
<ellipse cx="46" cy="54" rx="4.5" ry="6.5" fill="${INK}"/><ellipse cx="74" cy="54" rx="4.5" ry="6.5" fill="${INK}"/>
<circle cx="47.6" cy="51.5" r="1.7" fill="#fff"/><circle cx="75.6" cy="51.5" r="1.7" fill="#fff"/>
<circle cx="36" cy="68" r="5" fill="#ff8fa3" opacity=".7"/><circle cx="84" cy="68" r="5" fill="#ff8fa3" opacity=".7"/>
<path d="M47 68 Q60 84 73 68Z" fill="#8a1c3a" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
<path d="M30 42 Q34 30 46 26" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".85"/>
</svg>`;

const SCENE = `<svg viewBox="0 0 320 170" class="scene" role="img" aria-label="Gedung Kantor Pajak kartun" style="font-family:'Fredoka','Trebuchet MS',sans-serif">
<g stroke="${INK}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
<g fill="#fff"><ellipse cx="52" cy="26" rx="26" ry="12"/><ellipse cx="72" cy="20" rx="18" ry="11"/><ellipse cx="262" cy="34" rx="24" ry="11"/><ellipse cx="280" cy="28" rx="15" ry="9"/></g>
<rect x="8" y="150" width="304" height="18" rx="8" fill="#35d6a4"/>
<rect x="64" y="46" width="192" height="104" rx="10" fill="#ffd23f"/>
<rect x="88" y="14" width="144" height="38" rx="10" fill="#ff6b6b"/>
<rect x="80" y="68" width="48" height="36" rx="6" fill="#bde7ff"/><path d="M104 68 V104 M80 86 H128" fill="none"/>
<rect x="192" y="68" width="48" height="36" rx="6" fill="#bde7ff"/><path d="M216 68 V104 M192 86 H240" fill="none"/>

  }).join('')}</div>
  <div class="row2"><button class="btn sky" data-act="book">📖 Buku Saku</button><button class="btn ${done === 4 ? 'coral pulse' : 'white'}" data-act="rapor">🧾 Rapor</button></div>
  <p class="foot">Nominal dan tarif perlu diverifikasi ke sumber resmi DJP.</p>`;
}

function notesHTML() {
  if (!M.notes.length) return M.phase === 'chat' ? '<div class="note empty">📝 Catatan masih kosong. Tanyakan hal yang penting dulu!</div>' : '';
  return `<div class="note"><b>📝 Catatan klien</b><ul>${M.notes.map(n => `<li>${n}</li>`).join('')}</ul></div>`;
}

function missionHTML() {
  const cl = C(), ph = M.phase, idx = {chat:0, choice:1, form:2, result:3}[ph];
  const mood = ph === 'result' ? M.mood : (cl.mood0 || 'happy');
  let body = '';
  if (ph === 'chat') {
    const left = 4 - M.asked.length;
    body = `<div class="chat" aria-live="polite">
      <div class="msg"><div class="mini" style="background:${cl.bg}">${avatar(cl.av, cl.mood0 || 'happy')}</div><div class="bubble">${cl.intro}</div></div>
      ${M.chat.map((m, k) => m.me ? `<div class="msg me pop"><div class="bubble">${m.me}</div></div>` : `<div class="msg pop"><div class="mini" style="background:${cl.bg}">${avatar(cl.av, 'happy')}</div><div class="bubble">${m.them}</div></div>`).join('')}
    </div>
    ${notesHTML()}
    <div class="quota">Sisa pertanyaan: ${[0, 1, 2, 3].map(i => `<span class="coin ${i >= left ? 'used' : ''}">🪙</span>`).join('')}</div>
    <div class="qs">${cl.qs.map((q, i) => `<button class="q" data-act="ask" data-i="${i}" ${M.asked.includes(i) || left <= 0 ? 'disabled' : ''}>${q.t}</button>`).join('')}</div>
    <button class="btn mint" data-act="endint" ${M.asked.length ? '' : 'disabled'}>${left <= 0 ? 'Lanjut ke keputusan' : 'Cukup bertanya, lanjut'}</button>`;
  } else if (ph === 'choice') {
    const ch = cl.choice;
    body = `${M.flash ? `<div class="fb">${M.flash}</div><div style="height:12px"></div>` : ''}${notesHTML()}
    <div class="card"><h3>${ch.q}</h3>
    ${ch.opts.map((o, i) => `<button class="opt ${M.cwrong.includes(i) ? 'bad' : ''} ${M.cdone && i === ch.ans ? 'good' : ''}" data-act="pick" data-i="${i}" ${M.cdone || M.cwrong.includes(i) ? 'disabled' : ''}>${o}</button>`).join('')}
    ${M.cdone ? `<div class="fb">${M.cok ? '🎉 Tepat! ' : '💡 Jawaban yang benar sudah ditandai hijau. '}${ch.exp}</div>` : M.cwrong.length ? '<div class="fb shake">Belum tepat. Coba sekali lagi (poin jadi setengah).</div>' : ''}
    </div>
    ${M.cdone ? '<button class="btn mint" data-act="toform">Lanjut ke formulir</button>' : ''}`;
  } else if (ph === 'form') {
    const f = cl.form;
    body = `${notesHTML()}<div class="doc"><span class="ribbon">FORMULIR</span><h3>${f.title}</h3>${f.fields.map(fieldHTML).join('')}</div>
    ${M.fdone ? '<button class="btn mint" data-act="finish">Lihat hasil</button>' : `<button class="btn" data-act="check">Periksa jawaban</button><p class="muted center">Kesempatan ${2 - M.ftry}x lagi. Jawaban benar di percobaan kedua bernilai setengah.</p>`}`;
  } else {
    const r = M, msg = r.total >= 80 ? 'Mantap sekali! Urusan pajakku aman berkat kamu 🎉' : r.total >= 50 ? 'Lumayan, tapi masih ada yang perlu dibenahi ya...' : 'Waduh, kayaknya aku masih rawan kena denda nih...';
    body = `<div class="card center"><div class="big" style="background:${cl.bg}">${avatar(cl.av, r.mood)}</div><div class="bubble" style="max-width:100%;border-radius:18px;margin:8px 0 12px">${msg}</div>
      <span class="stamp">SELESAI</span>
      <div style="margin-top:14px;text-align:left">
      <div class="score"><span>💬 Wawancara</span><b>${r.pts.i}/30</b></div>
      <div class="score"><span>🧠 Keputusan</span><b>${r.pts.c}/30</b></div>
      <div class="score"><span>📝 Formulir</span><b>${r.pts.f}/40</b></div>
      ${r.pen ? `<div class="score"><span>📖 Buku saku</span><b>−${r.pen}</b></div>` : ''}
      <div class="score total"><span>Total</span><b>${r.total}/100</b></div></div></div>
    <div class="card"><h3>Yang perlu kamu ingat</h3><ul class="pts">${cl.explain.map(e => `<li>${e}</li>`).join('')}</ul></div>
    <div class="row2"><button class="btn white" data-act="open" data-id="${cl.id}">Ulangi</button><button class="btn mint" data-act="hub">Ke kantor</button></div>`;
  }
  const steps = ['Wawancara', 'Keputusan', 'Formulir'];
  return `<div class="mbar"><button class="icon" data-act="exit" aria-label="Kembali ke kantor">←</button><div class="mtitle"><b>${cl.name}</b><span>${cl.topic}</span></div><button class="icon" data-act="calc" aria-label="Kalkulator">🧮</button><button class="icon" data-act="book" aria-label="Buku saku">📖</button></div>
  <div class="steps">${steps.map((s, i) => `<span class="${i < idx ? 'done' : i === idx ? 'on' : ''}">${i < idx ? '✔ ' : ''}${s}</span>`).join('')}</div>${body}`;
}

function fieldHTML(f) {
  if (f.kind === 'grp') return `<div class="grp">${f.label}</div>`;
  if (f.kind === 'info') return `<div class="frow info"><span>${f.label}</span><b>${f.val}</b></div>`;
  const st = M.fs[f.id] || '', locked = /^ok|reveal/.test(st);
  const val = st === 'reveal' ? (f.kind === 'num' ? f.ans.toLocaleString('id-ID') : f.ans) : (M.vals[f.id] || '');
  const inp = f.kind === 'num'
    ? `<div class="inwrap"><i>Rp</i><input inputmode="numeric" autocomplete="off" aria-label="${f.label}" data-fid="${f.id}" data-kind="num" value="${val}" ${locked ? 'disabled' : ''}></div>`
    : `<select aria-label="${f.label}" data-fid="${f.id}" data-kind="sel" ${locked ? 'disabled' : ''}><option value="">Pilih…</option>${f.opts.map(o => `<option ${val === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
  const cls = /^ok/.test(st) ? 'ok' : st === 'bad' ? 'bad' : st === 'reveal' ? 'reveal' : '';
  const note = /^ok/.test(st) ? '<div class="hint">✔ Benar!</div>' : st === 'bad' ? `<div class="hint">✖ Belum tepat. Petunjuk: ${f.hint}</div>` : st === 'reveal' ? '<div class="hint">💡 Ini jawaban yang benar.</div>' : '';
  return `<div class="frow ${cls}"><label>${f.label}</label>${inp}${note}</div>`;
}

function raporHTML() {
  const rs = CL.map(c => S.res[c.id] ? S.res[c.id].total : null);
  const avg = Math.round(rs.reduce((a, b) => a + (b || 0), 0) / 4);
  const done = rs.filter(x => x !== null).length;
  const title = done < 4 ? 'Masih magang...' : avg >= 90 ? 'Konsultan Pajak Bintang 5 ⭐' : avg >= 75 ? 'Konsultan Andal 💼' : avg >= 50 ? 'Konsultan Junior Rajin 📒' : 'Magang Perlu Ngulang 🔁';
  const code = 'KPN-' + btoa(unescape(encodeURIComponent(S.name + '|' + rs.map(x => x === null ? '-' : x).join('.'))));
  return `<div class="card center"><div class="me" style="width:96px;height:96px;margin:0 auto 8px">${avatar(AV[S.av], avg >= 50 ? 'joy' : 'think')}</div>
    <h2>${esc(S.name || 'Konsultan')}</h2><p style="margin:4px 0 0;font-weight:600">${title}</p>
    <div class="score total" style="justify-content:center;gap:10px"><span>Rata-rata</span><b>${avg}/100</b></div></div>
  <div class="card"><table class="rap">${CL.map((c, i) => `<tr><td>${c.name}<br><small style="font-weight:500">${c.topic}</small></td><td>${rs[i] === null ? '—' : rs[i] + '/100'}</td></tr>`).join('')}</table></div>
  <div class="card"><b>Kode hasil untuk guru</b><p class="muted" style="margin:4px 0 8px">Salin kode ini dan kirim ke gurumu.</p><div class="code" id="code">${code}</div><div style="height:10px"></div><button class="btn sky" data-act="copy">Salin kode</button></div>
  <div class="row2"><button class="btn mint" data-act="hub">Ke kantor</button><button class="btn white" data-act="reset">Mulai ulang</button></div>`;
}

/* ===== SHEET ===== */
function openSheet(html) { $('#sheet').innerHTML = `<div class="sheet-wrap" data-act="closebg"><div class="sheet" role="dialog" aria-modal="true">${html}<div style="height:12px"></div><button class="btn white" data-act="closesheet">Tutup</button></div></div>`; }
function closeSheet() { $('#sheet').innerHTML = ''; }
function calcHTML() {
  const ks = ['C', '⌫', '÷', '×', '7', '8', '9', '−', '4', '5', '6', '+', '1', '2', '3', '=', '0', '.', '(', ')'];
  return `<h2>🧮 Kalkulator</h2><div class="disp" id="disp">${esc(calcExpr) || '0'}</div><div class="keys">${ks.map(k => `<button data-act="ck" data-k="${k}" class="${'÷×−+'.includes(k) ? 'op' : k === '=' ? 'eq' : k === 'C' ? 'cl2' : ''}">${k}</button>`).join('')}</div>`;
}
function calcKey(k) {
  if (calcExpr === 'Error') calcExpr = '';
  if (k === 'C') calcExpr = '';
  else if (k === '⌫') calcExpr = calcExpr.slice(0, -1);
  else if (k === '=') {
    try {
      const ex = calcExpr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
      if (ex && /^[0-9+\-*/.() ]+$/.test(ex)) calcExpr = String(Math.round(Function('"use strict";return (' + ex + ')')() * 1e6) / 1e6);
    } catch (e) { calcExpr = 'Error'; }
  } else calcExpr += k;
  $('#disp').textContent = calcExpr || '0';
}

/* ===== LOGIKA MISI ===== */
function startMission(id) {
  M = {cid:id, phase:'chat', asked:[], notes:[], chat:[], pts:{i:0, c:0, f:0}, pen:0, cwrong:[], cdone:false, cok:false, vals:{}, fs:{}, ftry:0, fdone:false, flash:'', total:0, mood:'happy'};
  scr = 'mission'; draw();
}
function ask(i) {
  const q = C().qs[i];
  if (M.asked.includes(i) || M.asked.length >= 4) return;
  M.asked.push(i); M.chat.push({me:q.t}, {them:q.r});
  if (q.key) { M.pts.i += 10; M.notes.push(q.note); }
  draw(true);
}
function endInterview() {
  const missed = [];
  C().qs.forEach((q, i) => { if (q.key && !M.asked.includes(i)) { M.notes.push(q.note); missed.push(q); } });
  M.flash = missed.length ? '🙈 ' + C().missed + ' (Kamu tidak menanyakan ' + missed.length + ' hal penting, jadi tidak ada poin untuk itu.)' : '';
  M.phase = 'choice'; draw();
}
function pick(i) {
  const ch = C().choice;
  if (i === ch.ans) { M.pts.c = M.cwrong.length ? 15 : 30; M.cdone = true; M.cok = true; }
  else { M.cwrong.push(i); if (M.cwrong.length >= 2) { M.cdone = true; M.cok = false; M.pts.c = 0; } }
  draw(true);
}
function checkForm() {
  M.ftry++;
  C().form.fields.forEach(fl => {
    if (fl.kind === 'grp' || fl.kind === 'info') return;
    if (/^ok/.test(M.fs[fl.id] || '')) return;
    const v = M.vals[fl.id] || '';
    let ok = false;
    if (fl.kind === 'num') { const n = parseInt(String(v).replace(/\D/g, ''), 10); ok = !isNaN(n) && Math.abs(n - fl.ans) <= (fl.tol || 1); }
    else ok = v === fl.ans;
    if (ok) { M.fs[fl.id] = M.ftry === 1 ? 'ok1' : 'ok2'; M.pts.f += M.ftry === 1 ? fl.pts : Math.round(fl.pts / 2); }
    else M.fs[fl.id] = M.ftry >= 2 ? 'reveal' : 'bad';
  });
  const all = C().form.fields.filter(f => f.pts).every(f => /^ok/.test(M.fs[f.id] || ''));
  if (all || M.ftry >= 2) M.fdone = true;
  draw(true);
}
function finish() {
  const cl = C(), raw = M.pts.i + M.pts.c + M.pts.f, total = Math.max(0, raw - M.pen);
  M.total = total; M.mood = total >= 80 ? 'joy' : total >= 50 ? 'think' : 'worried';
  const prev = S.res[cl.id];
  if (!prev || total >= prev.total) S.res[cl.id] = {i:M.pts.i, c:M.pts.c, f:M.pts.f, pen:M.pen, total};
  save(); M.phase = 'result'; draw();
}
function openBook() {
  if (scr === 'mission' && M && M.phase !== 'result' && !M.pen) { M.pen = 5; toast('Buku saku dibuka: −5 poin untuk klien ini'); }
  openSheet('<h2>📖 Buku Saku Pajak</h2><p class="muted" style="margin:0">Ringkasan aturan. Semua angka perlu dicek ulang ke sumber resmi DJP.</p>' + BOOK);
}

/* ===== EVENT ===== */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'closebg') { if (e.target === b) closeSheet(); return; }
  switch (a) {
    case 'av': S.av = i; draw(true); break;
    case 'start': S.name = (draft || '').trim() || 'Konsultan Muda'; S.res = {}; save(); scr = 'hub'; draw(); break;
    case 'resume': scr = 'hub'; draw(); break;
    case 'open': closeSheet(); startMission(b.dataset.id); break;
    case 'exit': case 'hub': scr = 'hub'; M = null; draw(); break;
    case 'book': openBook(); break;
    case 'calc': calcExpr = ''; openSheet(calcHTML()); break;
    case 'ck': calcKey(b.dataset.k); break;
    case 'closesheet': closeSheet(); break;
    case 'ask': ask(i); break;
    case 'endint': endInterview(); break;
    case 'pick': pick(i); break;
    case 'toform': M.phase = 'form'; draw(); break;
    case 'check': checkForm(); break;
    case 'finish': finish(); break;
    case 'rapor': scr = 'rapor'; draw(); break;
    case 'copy': {
      const t = $('#code').textContent;
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast('Kode disalin'), () => toast('Salin manual: tekan lama pada kode'));
      else toast('Salin manual: tekan lama pada kode');
      break;
    }
    case 'reset': if (confirm('Hapus semua progres dan mulai dari awal?')) { S = {name:'', av:0, res:{}}; draft = ''; save(); scr = 'start'; draw(); } break;
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('cl')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'nm') { draft = t.value; return; }
  if (t.dataset && t.dataset.fid) {
    if (t.dataset.kind === 'num') { const d = t.value.replace(/\D/g, ''); t.value = d ? Number(d).toLocaleString('id-ID') : ''; }
    M.vals[t.dataset.fid] = t.value;
  }
});

draw();
</script>
</body>
</html>
